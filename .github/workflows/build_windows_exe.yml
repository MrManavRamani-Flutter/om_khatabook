name: Build Windows Desktop Setup Installer (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows .EXE Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Windows Desktop (Release Mode)
        run: flutter build windows --release

      - name: Verify Build Output Structure
        shell: pwsh
        run: |
          # Locate built executable dynamically
          $exe = Get-ChildItem -Path "build\windows" -Filter "om_khatabook.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "Release executable om_khatabook.exe was not found in build\windows!"
            exit 1
          }
          Write-Host "Found release executable at: $($exe.FullName)"
          $srcDir = $exe.DirectoryName

          # Ensure build\windows\x64\runner\Release exists for Inno Setup
          $targetDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$targetDir\om_khatabook.exe")) {
            Write-Host "Aligning build output into $targetDir..."
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item -Path "$srcDir\*" -Destination $targetDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null
          Write-Host "Build output structure verified successfully."

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Compile Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)?.FullName
            }
          }
          Write-Host "Using Inno Setup Compiler: $iscc"
          & $iscc "windows\installer\inno_setup.iss"

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release\*"
          Compress-Archive -Path $releaseDir -DestinationPath "build\installer\OmMavtarKhataBook_Windows_Portable_v2.0.0.zip" -Force
          Write-Host "Created portable ZIP package."

      - name: Upload Windows Setup .EXE & Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmMavtarKhataBook-Windows-Installer
          path: build/installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Output Release Summary to GitHub Action
        shell: pwsh
        run: |
          $setupExe = Get-Item "build\installer\OmMavtarKhataBook_Setup.exe"
          $setupSizeMB = [math]::Round($setupExe.Length / 1MB, 2)
          
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "# 🚀 OM Mavtar Group Khata Book - Windows Release Ready!"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Artifacts generated:"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Setup Installer**: `OmMavtarKhataBook_Setup.exe` ($setupSizeMB MB)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Portable Zip**: `OmMavtarKhataBook_Windows_Portable_v2.0.0.zip`"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### How to download & run:"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "1. Scroll down to the **Artifacts** section below on this run page."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "2. Click **OmMavtarKhataBook-Windows-Installer** to download the zip."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "3. Run `OmMavtarKhataBook_Setup.exe` to install on any Windows 10/11 computer."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "4. Clean uninstall is available anytime via Windows *Add or Remove Programs*."

