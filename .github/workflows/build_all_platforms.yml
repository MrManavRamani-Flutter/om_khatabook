name: Build All Platforms & Direct Install Packages (Windows, Android, macOS, iOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as official GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto v2.0.0 / tag)'
        required: false
        type: string
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. ANDROID: DIRECT INSTALLABLE APK (.apk) & PLAY BUNDLE (.aab)
  # ============================================================================
  build-android:
    name: 📱 Build Android APK & AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android Release AppBundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Stage Android Install Files
        run: |
          mkdir -p build/dist/android
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/android/OmMavtarKhataBook_Android.apk
          cp build/app/outputs/bundle/release/app-release.aab build/dist/android/OmMavtarKhataBook_Android.aab
          ls -lh build/dist/android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmMavtarKhataBook-Android
          path: build/dist/android/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 2. WINDOWS: DIRECT SETUP INSTALLER (.exe) & PORTABLE ZIP
  # ============================================================================
  build-windows:
    name: 💻 Build Windows Setup (.exe) & Portable Zip
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Windows Desktop (Release Mode)
        run: flutter build windows --release

      - name: Verify Build Output Structure
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build\windows" -Filter "om_khatabook.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "Release executable om_khatabook.exe was not found in build\windows!"
            exit 1
          }
          Write-Host "Found release executable at: $($exe.FullName)"
          $srcDir = $exe.DirectoryName

          # Align to build\windows\x64\runner\Release for Inno Setup
          $targetDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$targetDir\om_khatabook.exe")) {
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item -Path "$srcDir\*" -Destination $targetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null
          New-Item -ItemType Directory -Force -Path "build\dist\windows" | Out-Null

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Compile Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)?.FullName
            }
          }
          Write-Host "Using Inno Setup Compiler: $iscc"
          & $iscc "windows\installer\inno_setup.iss"

      - name: Package Windows Install Files
        shell: pwsh
        run: |
          Copy-Item -Path "build\installer\OmMavtarKhataBook_Setup.exe" -Destination "build\dist\windows\OmMavtarKhataBook_Windows_Setup.exe" -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\dist\windows\OmMavtarKhataBook_Windows_Portable.zip" -Force
          Get-ChildItem "build\dist\windows"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmMavtarKhataBook-Windows
          path: build/dist/windows/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 3. MACOS: DIRECT INSTALLABLE DISK IMAGE (.dmg) & APP ZIP (.zip)
  # ============================================================================
  build-macos:
    name: 🍏 Build macOS DMG Installer & App Zip
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build macOS Desktop (Release Mode)
        run: flutter build macos --release

      - name: Package macOS DMG & Portable Zip
        run: |
          mkdir -p build/dist/macos
          APP_PATH="build/macos/Build/Products/Release/om_khatabook.app"

          # 1. Portable ZIP (Unzip and double-click to run)
          cd build/macos/Build/Products/Release
          zip -r -9 "../../../../../build/dist/macos/OmMavtarKhataBook_macOS.zip" om_khatabook.app
          cd -

          # 2. Drag-and-Drop Disk Image (.dmg) Installer
          mkdir -p build/dmg_staging
          cp -R "$APP_PATH" build/dmg_staging/
          ln -s /Applications build/dmg_staging/Applications

          hdiutil create -volname "OM Mavtar Khata Book" \
            -srcfolder build/dmg_staging \
            -ov -format UDZO \
            build/dist/macos/OmMavtarKhataBook_macOS.dmg

          rm -rf build/dmg_staging
          ls -lh build/dist/macos

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmMavtarKhataBook-macOS
          path: build/dist/macos/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 4. IOS: DIRECT INSTALLABLE APP PACKAGE (.ipa)
  # ============================================================================
  build-ios:
    name: 📲 Build iOS Package (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable iOS Support
        run: flutter config --enable-ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned IPA Payload)
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          mkdir -p build/dist/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/dist/ios/Payload/
          cd build/dist/ios
          zip -r -9 OmMavtarKhataBook_iOS.ipa Payload
          rm -rf Payload
          ls -lh
          cd -

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmMavtarKhataBook-iOS
          path: build/dist/ios/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 5. UNIFIED RELEASE: PUBLISH DIRECT DOWNLOAD INSTALLERS TO GITHUB RELEASES
  # ============================================================================
  publish-release:
    name: 🚀 Publish Direct Installers to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos, build-ios]
    if: |
      always() &&
      (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-ios.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OmMavtarKhataBook-Android
          path: release_assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OmMavtarKhataBook-Windows
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OmMavtarKhataBook-macOS
          path: release_assets/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OmMavtarKhataBook-iOS
          path: release_assets/

      - name: List All Downloaded Install Files
        run: |
          ls -lh release_assets/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v2.0.0"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Using Release Tag: $TAG_NAME"

      - name: Generate GitHub Release with Direct Installers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "OM Mavtar Group Khata Book - ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            # 🚀 OM Mavtar Group Khata Book (${{ steps.tag_info.outputs.tag }})
            
            Official direct installation packages for Windows, Android, macOS, and iOS.
            
            ---
            
            ### 📥 Direct Download & Installation Files:
            
            | Platform | File Format | Download Asset | Description & How to Install |
            | :--- | :--- | :--- | :--- |
            | 💻 **Windows** | Setup `.exe` | **`OmMavtarKhataBook_Windows_Setup.exe`** | Double-click to install on Windows 10/11. Includes Desktop Shortcut & Start Menu entry. |
            | 💻 **Windows** | Portable `.zip` | **`OmMavtarKhataBook_Windows_Portable.zip`** | Extract folder and double-click `om_khatabook.exe` to run immediately without installation. |
            | 📱 **Android** | Direct `.apk` | **`OmMavtarKhataBook_Android.apk`** | Download on any Android phone/tablet, tap file to install directly (enable *Install Unknown Apps*). |
            | 📱 **Android** | Play Bundle `.aab` | **`OmMavtarKhataBook_Android.aab`** | Official Android App Bundle for Google Play Console submission. |
            | 🍏 **macOS** | Disk Image `.dmg` | **`OmMavtarKhataBook_macOS.dmg`** | Double-click DMG and drag `om_khatabook.app` into Applications folder. |
            | 🍏 **macOS** | Portable `.zip` | **`OmMavtarKhataBook_macOS.zip`** | Unzip and drag `om_khatabook.app` into Applications folder. |
            | 📲 **iOS** | App Package `.ipa` | **`OmMavtarKhataBook_iOS.ipa`** | Direct install on iPhone/iPad using AltStore, Sideloadly, TrollStore, Scarlet, or Xcode. |
            
            ---
            
            ### 🔐 Master Credentials:
            - **Default Master Password**: `OMMAVTAR36`
            - **Default Operator**: `OM MAVTAR`
            
            ### 💾 Data Safety & Offline Storage:
            - All ledger data is stored locally on device.
            - Full JSON database backups can be exported or imported anytime under **Settings > Backup & Data Safety**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Summary on GitHub Action Run
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🎉 All Direct Installation Packages Built Successfully!

          All 4 platform packages are ready for direct download:

          ### 📦 Generated Files:
          - 💻 **Windows**: `OmMavtarKhataBook_Windows_Setup.exe` & `OmMavtarKhataBook_Windows_Portable.zip`
          - 📱 **Android**: `OmMavtarKhataBook_Android.apk` & `OmMavtarKhataBook_Android.aab`
          - 🍏 **macOS**: `OmMavtarKhataBook_macOS.dmg` & `OmMavtarKhataBook_macOS.zip`
          - 📲 **iOS**: `OmMavtarKhataBook_iOS.ipa`

          ---

          ### 🚀 How to Download:
          1. **Direct from Releases**: Check the [Releases tab](https://github.com/${{ github.repository }}/releases) on your GitHub repository.
          2. **Direct from this Action**: Scroll down to the **Artifacts** section at the bottom of this page to download any platform package.
          EOF

